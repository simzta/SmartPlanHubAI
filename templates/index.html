<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Plan Hub ChatBot</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>
    <button id="toggle">Chat</button>

    <div id="chatbot-container">
        <div id='header'>
            <h3>SmartPlanHub AI Assistant</h3>
        </div>

        <div id="intro">
            <p>Ask me anything — deadlines, progress, plans. I'm your scheduler!</p>
        </div>

        <div id="chat-container"></div>

        <form id="inquiry-form" action="/handle_inquiry" method="post">
            <input type="text" name="inquiry" id="inquiry" placeholder="Ask: What do I have due? How am I doing?" autocomplete="off">
            <button id="submit" type="submit">Send</button>
        </form>
    </div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const toggleBtn = document.getElementById("toggle");
    const chatBox = document.getElementById("chat-container");
    const form = document.getElementById("inquiry-form");
    const input = document.getElementById("inquiry");

    toggleBtn.onclick = () => {
        const chat = document.getElementById("chatbot-container");
        chat.style.display = chat.style.display === "none" ? "block" : "none";
    };

    form.onsubmit = (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        addMessage("user-message", text);
        showTyping();

        fetch("/handle_inquiry", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({ inquiry: text })
        })
        .then(res => res.json())
        .then(data => {
            hideTyping();
            addMessage("bot-message", data.response);
        })
        .catch(() => {
            hideTyping();
            addMessage("bot-message", "Server error.");
        });

        input.value = "";
    };

    function addMessage(className, text) {
        const msg = document.createElement("div");
        msg.classList.add("message", className);
        msg.innerHTML = text;
        chatBox.appendChild(msg);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showTyping() {
        hideTyping();
        const t = document.createElement("div");
        t.id = "typing";
        t.classList.add("message", "bot-message");
        t.innerHTML = "Typing...";
        chatBox.appendChild(t);
    }

    function hideTyping() {
        const t = document.getElementById("typing");
        if (t) t.remove();
    }
});
</script>
</body>
</html>
